<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProctorAI - The Future of Exam Integrity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #09090b; color: #f8fafc; overflow: hidden; }
        .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.4), rgba(15, 23, 42, 0.6)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .gradient-text { background: linear-gradient(135deg, #60a5fa, #c084fc); -webkit-background-clip: text; color: transparent; }
        
        .animated-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.1), transparent 50%),
                        radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15), transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15), transparent 40%);
            animation: pulseBg 15s ease-in-out infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(5deg); }
        }

        .float-animation { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative">
    
    <div class="animated-bg"></div>

    <!-- Decorative Elements -->
    <div class="absolute top-20 left-20 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl float-animation" style="animation-delay: 0s;"></div>
    <div class="absolute bottom-20 right-20 w-40 h-40 bg-purple-500/20 rounded-full blur-3xl float-animation" style="animation-delay: -3s;"></div>

    <div class="glass-card p-16 rounded-[3rem] text-center max-w-4xl z-10 mx-4 border-t border-l border-white/20">
        
        <div class="mb-8 inline-block">
            <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shadow-[0_0_40px_rgba(139,92,246,0.5)] transform -rotate-12 hover:rotate-0 transition-transform duration-500">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
        </div>

        <h1 class="text-6xl md:text-7xl font-black mb-6 tracking-tight text-white drop-shadow-lg">
            Proctor<span class="gradient-text">AI</span>
        </h1>
        
        <p class="text-xl md:text-2xl text-slate-300 mb-12 font-light leading-relaxed max-w-2xl mx-auto">
            The next generation of examination integrity. Powered by advanced <span class="text-white font-semibold">Deep Learning</span> and real-time computer vision analysis.
        </p>
        
        <div class="flex flex-col sm:flex-row justify-center gap-6">
            <a href="/student/login" class="group relative px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl text-white font-bold text-lg transition-all shadow-[0_0_30px_rgba(59,130,246,0.4)] hover:shadow-[0_0_50px_rgba(139,92,246,0.6)] transform hover:-translate-y-1 overflow-hidden">
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-in-out"></div>
                <span class="relative flex items-center justify-center gap-2">
                    Enter Student Portal
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </span>
            </a>
            
            <a href="/admin/login" class="group px-8 py-4 glass-card rounded-2xl text-slate-300 hover:text-white font-bold text-lg transition-all border border-slate-600 hover:border-slate-400 hover:bg-white/5 flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-slate-400 group-hover:text-purple-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Admin Dashboard
            </a>
        </div>
    </div>
    
    <div class="absolute bottom-8 text-slate-500 text-sm font-semibold tracking-widest uppercase">
        Protected by Deep Neural Networks
    </div>
</body>
</html>
