<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - ProctorAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #09090b; color: #f8fafc; overflow: hidden; }
        .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .input-field { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: white; transition: all 0.3s ease; }
        .input-field:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 15px rgba(59,130,246,0.3); background: rgba(0,0,0,0.6); }
        
        .animated-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 10% 90%, rgba(59, 130, 246, 0.15), transparent 50%),
                        radial-gradient(circle at 90% 10%, rgba(139, 92, 246, 0.15), transparent 50%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">
    
    <div class="animated-bg"></div>

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[100px] pointer-events-none"></div>

    <div class="glass-card p-12 rounded-[2.5rem] w-full max-w-md z-10 border-t border-l border-white/20">
        
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-white tracking-tight mb-2">
                {% if register %}Create Account{% else %}Welcome Back{% endif %}
            </h2>
            <p class="text-slate-400 text-sm font-semibold uppercase tracking-widest">Student Portal</p>
        </div>
        
        <form method="POST" action="{% if register %}/student/register{% else %}/student/login{% endif %}" class="space-y-5">
            {% if register %}
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Full Name</label>
                <input type="text" name="full_name" required class="input-field w-full px-5 py-4 rounded-xl text-sm placeholder-slate-600" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Roll Number</label>
                <input type="text" name="roll_number" required class="input-field w-full px-5 py-4 rounded-xl text-sm placeholder-slate-600" placeholder="e.g. CS2024-001">
            </div>
            {% endif %}
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Email Address</label>
                <input type="email" name="email" required class="input-field w-full px-5 py-4 rounded-xl text-sm placeholder-slate-600" placeholder="student@university.edu">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Password</label>
                <input type="password" name="password" required class="input-field w-full px-5 py-4 rounded-xl text-sm placeholder-slate-600" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full mt-8 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] transform hover:-translate-y-1">
                {% if register %}Register & Continue{% else %}Secure Login{% endif %}
            </button>
        </form>
        
        <div class="mt-8 text-center text-slate-400 text-sm font-semibold">
            {% if register %}
            Already registered? <a href="/student/login" class="text-blue-400 hover:text-blue-300 transition-colors ml-1">Login here</a>
            {% else %}
            New student? <a href="/student/register" class="text-blue-400 hover:text-blue-300 transition-colors ml-1">Create account</a>
            {% endif %}
        </div>
        
        <div class="mt-8 text-center">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition-colors uppercase tracking-widest font-bold">← Back to Home</a>
        </div>
    </div>
</body>
</html>
