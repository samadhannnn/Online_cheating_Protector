<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - ProctorAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #09090b; color: #f8fafc; overflow: hidden; }
        .glass-card { background: linear-gradient(145deg, rgba(30, 41, 59, 0.7), rgba(15, 23, 42, 0.9)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .input-field { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: white; transition: all 0.3s ease; }
        .input-field:focus { outline: none; border-color: #a855f7; box-shadow: 0 0 15px rgba(168,85,247,0.3); background: rgba(0,0,0,0.6); }
        
        .animated-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.15), transparent 60%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">
    
    <div class="animated-bg"></div>

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[80px] pointer-events-none border border-purple-500/20"></div>

    <div class="glass-card p-12 rounded-[2.5rem] w-full max-w-md z-10 border-t border-l border-purple-500/30">
        
        <div class="text-center mb-10">
            <div class="w-16 h-16 mx-auto bg-purple-500/20 rounded-2xl flex items-center justify-center mb-6 border border-purple-500/50 shadow-[0_0_20px_rgba(168,85,247,0.3)]">
                <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h2 class="text-3xl font-black text-white tracking-tight mb-2">System Admin</h2>
            <p class="text-slate-400 text-sm font-semibold uppercase tracking-widest">Restricted Access</p>
        </div>
        
        <form method="POST" action="/admin/login" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Username</label>
                <input type="text" name="username" required class="input-field w-full px-5 py-4 rounded-xl text-sm placeholder-slate-600" placeholder="admin">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Password</label>
                <input type="password" name="password" required class="input-field w-full px-5 py-4 rounded-xl text-sm placeholder-slate-600" placeholder="••••••••">
            </div>
            
            <button type="submit" class="w-full mt-8 bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-500 hover:to-purple-400 text-white font-bold py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(168,85,247,0.3)] hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] transform hover:-translate-y-1 uppercase tracking-widest text-sm">
                Authenticate
            </button>
        </form>
        
        <div class="mt-10 text-center">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-300 transition-colors uppercase tracking-widest font-bold">← Return to Public Site</a>
        </div>
    </div>
</body>
</html>
